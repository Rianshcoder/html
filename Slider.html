<html>
    <body>
        <section>
            <img class="myslides" src="peacock img.jfif" style="height:500px">
            <img class="myslides" src="parrot img.jfif" style="height:500px">
        </section>
        <script>
           var myindex=0;
            carousel();
            function carousel(){
               var i;
               var x=document.getElementByClassName("myslides");
               for(i=0; i<x.length; i++)
               {
                x[i].style.display="none";
               }
               myindex++;
               if(myindex>x.length){
                myindex=1;
               }
               x[myindex-1].style.display="block";
               setTimeOut(carousel,30);
            }
        </script>
    </body>
</html>
