<html>
    <head>
        <title>Parameters and functions</title>
    </head>
    <body>
        <script>
            let OddorEven = function(number){
                if (number %2 == 0){
                document.write(number +"number is even");
                }else{
                    document.write(number +"number is odd");
                }
            } 
            let number = prompt("Enter the Number:");
            OddorEven(number);
        </script>
    </body>
</html>
