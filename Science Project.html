<html>
    <head>
        <meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.

CSS">

<title>My Science Lab</title>
<style>
    body {background-color: #f4fff4; font-family: Arial, sans-serif;}
    .jumbotron {background-color: #e6f9ec; border-left: 6px solid #FF5A43;}
    .jumbotron {color: #FF5A43;}
    .section-title {background-color: #FF5A43; margin-top: 30px; margin-bottom: 15px;}
    p {font-weight: bold; margin-bottom: 5px;}
</style>
</head>
<body>
    <div class="jumbotron jumbotron-container">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Here are the experiments that are running</p>
            <button class="btn btn-primary">Chemistery</button>
             <button class="btn btn-success">Biology</button>
              <button class="btn btn-warning">Physics</button>
               <button class="btn btn-danger">Astronomy</button>
        </div>
    </div>
    <div class-="container">
        <h2 class="section-title>Experiments Completed<span class="badge badge-danger">4</span></h2>
        <p>Chemistery<span class="badge badge-primary>7  experiments</span></p>
        <p>Biology<span class="badge badge-success>5  experiments</span></p>
        <p>Physics<span class="badge badge-warning>4 experiments</span></p>
        <p>Astronomy<span class="badge badge-danger>3 experiments</span></p>
        <h2 class="section-title">Research Progress</h2>
        <p>Chemistery</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width:85%">85%</div>
            </div>
            <p>Biology</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:45%">75%</div>
        </div>
            <p>Physics</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width:65%">65%</div>
            </div>
            <p>Astronomy</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width:70%">70%</div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
