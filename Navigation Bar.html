<html>
    <head>
        <title>Navigation Bar</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 0px;
            }
            .topnav {
                background-color: #333;
                overflow: hidden;
            }
            .topnav a {
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover {
                background-color: #ddd;
                color: black;
            }
            .topnav a.active {
                background-color: #ffe066;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="home">Home</a>
                <a class="#">About Us</a>
                <a class="#">Gallery</a>
                <a class="#">Contact Us</a>
        </div>
    </body>
</html>
