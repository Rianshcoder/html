<html>
    <head>
        <title>My Animal Fact File</title>
        <style>

            /* Page Background - sets the font and color fo the whole page */
            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid forestgreen;
                margin: 30px;
            }

            /* Animal Name- forestgreen so it stands out */
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }

            /* Detail Rows - dark text on the light background */
            .detail {
                color: darkslategray;
            }

            /* Cool Fact - orange and itallic to make it feel special */
            .cool-fact {
                color:darkorange;
                font-style: italic;
            }
            </style>
            </head>
            <body>

             <div class="fact-file">
                <h2 class="animal-name">Snow Leopard</h2>
                <p class="detail">Lives In- Mountain Ranges of Central Asia</p>
                <p class="detail">Diet- Deer, Goat and Wild Sheep</p>
                <p class="cool-fact">Cool-Fact- Can leap up to 15 meters in one jump!</p>
             </div>

             </body>
             </html>
