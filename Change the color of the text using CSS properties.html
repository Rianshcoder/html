<!DOCTYPE html>
<html>
  <head>
    <style>
      #myElement {
        border: 1px solid #CCC;
        width: 400px;
        height: 400px;
      }
    </style>
    <meta charset="utf-8">
  </head>
  <body>
    <h2>Change The Color of The Text Using CSS Properties</h2>
    <div id="myElement"><h1>Hello World!</h1></div>
    <br>
    <button type="button" onclick="changeStyle()">Click Me</button>
    <script>
      function changeStyle() {
        var element = document.getElementById("myElement");
        element.style.color = "#FF0000";
      }
    </script>
  </body>
</html>
