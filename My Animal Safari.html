<html>
    <head>
         <meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.

CSS">

<title>My Animal Safari</title>
<style>
    body {
        position: relative;
    }
    .safari-slide {
         height: 200px;
        text-align: center;
        padding-top: 75px;
        font-size: 1.8;
        color: white;
    }
    .slide-forest {
        background-color: darkgreen;
    }
    .slide-ocean {
        background-color: steelblue;
    }
    .slide-desert {
        background-color: orange;
    }
</style>
    </head>
    <body data-spy="scroll" data-target="#safari-nav" data-offset="60">
        <div id="safari-carousel" class="carousel-slide" data-ride="carousel">
            <ol class="carousel-indicators">
              <li data-target="#safari-carousel" data-slide-to="0" class="active">Forest</li>
                 <li data-target="#safari-carousel" data-slide-to="1">Ocean</li>
                  <li data-target="#safari-carousel" data-slide-to="2">Desert</li>
            </ol>
             <div class="carousel-inner">
                <div class="carousel safari active safari slide slide forest">Forest Safari</div>
                <div class="carousel safari safari slide slide ocean">Ocean Safari</div>
                <div class="carousel safari safari slide slide forest">Desert Safari</div>
             </div>
             <a class="carousel-control-prev" href="#safari-carousel" data-slide="prev">
             <span class="carousel-control-prev-icon"></span>
             </a>
              <a class="carousel-control-next" href="#safari-carousel" data-slide="next">
             <span class="carousel-control-next-icon"></span>
             </a>
             </div>
             <nav id="safari-nav" class="navbar-navbar-expand-sm navbar-dark bg-dark sticky-top">
                <span class="navbar-brand">Safari Guide</span>
             </nav>
    </body>
</html>
