<html>
    <head>
        <title>Superhero Card</title>
        <style>
            /* Typogrphy - font, size, weight, color for the whole page */
            body {
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            /* Typography - text shadow + big bold title with an orange shadow */
            .hero name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }

            /* Typography - Text Transform + tagline becomes Title Case */
            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }

            /* Text Transform + Text Decoration - section headings in CAPS with underline */
            .label {
                text-decoration: underline;
                text-transform: uppercase;
                color: coral;
            }

            /* Typography - power stands out in bold green */
            .power {
                font-weight: bold;
                color: lightgreen;
            }
